<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHUHUA × BIFF26 Hashtag Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+TC:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F0FA; --surface:#FFFFFF; --ink:#1E2A5A; --muted:#5B6390;
  --rose:#C93A72; --rose-soft:#F7DCE8; --sky:#9DB8F2; --gold:#D6C4A0; --line:#D6D3EA;
  --ticket:#1E2A5A; --ticket-ink:#F2F0FA;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11173A; --surface:#1A2250; --ink:#ECEAF8; --muted:#A9AED3;
    --rose:#F07AA8; --rose-soft:#3A2350; --sky:#7E9BE0; --gold:#8C7448; --line:#2E3870;
    --ticket:#ECEAF8; --ticket-ink:#1E2A5A;
  }
}
:root[data-theme="dark"]{
  --paper:#11173A; --surface:#1A2250; --ink:#ECEAF8; --muted:#A9AED3;
  --rose:#F07AA8; --rose-soft:#3A2350; --sky:#7E9BE0; --gold:#8C7448; --line:#2E3870;
  --ticket:#ECEAF8; --ticket-ink:#1E2A5A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Noto Sans TC","Noto Sans KR","Noto Sans SC",-apple-system,"Segoe UI",system-ui,sans-serif;
  font-size:16px; line-height:1.6;
}
body[data-lang="ko"]{font-family:"Noto Sans KR",-apple-system,"Segoe UI",system-ui,sans-serif}
body[data-lang="en"]{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans KR","Noto Sans TC",sans-serif}
body[data-lang="zh-Hans"]{font-family:"Noto Sans SC","Noto Sans KR",-apple-system,system-ui,sans-serif}
.wrap{max-width:760px; margin:0 auto; padding:20px 18px 64px}
.topbar{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.brand{font-size:14px; color:var(--muted); letter-spacing:.02em}
.langs{display:flex; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:3px}
.langs button{border:0; background:transparent; color:var(--muted); font:inherit; font-size:13px; padding:5px 11px; border-radius:999px; cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}

/* Ticket hero */
.ticket{
  margin:22px 0 26px; background:var(--ticket); color:var(--ticket-ink);
  border-radius:18px; display:grid; grid-template-columns:1fr auto; position:relative; overflow:hidden;
}
.ticket-main{padding:26px 24px 22px}
.ticket-film{font-family:"Young Serif",Georgia,serif; font-size:clamp(34px,8vw,56px); line-height:1.02; margin:0 0 6px}
.ticket-star{font-family:"Young Serif",Georgia,serif; font-size:clamp(18px,4vw,22px); color:var(--gold); margin:0 0 18px}
.ticket-info{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:14px; margin:0}
.ticket-info dt{opacity:.65}
.ticket-info dd{margin:0}
.ticket-stub{
  border-left:2px dashed color-mix(in srgb,var(--ticket-ink) 35%,transparent);
  padding:22px 18px; display:flex; align-items:center; justify-content:center;
}

.ticket-still{grid-column:1/-1; margin:0; aspect-ratio:2048/715; overflow:hidden}
.ticket-still img{display:block; width:100%; height:100%; object-fit:cover; object-position:center; max-width:100%}
.ticket::before{top:calc(var(--imgh,0px) - 11px)}
.ticket::before,.ticket::after{
  content:""; position:absolute; width:22px; height:22px; border-radius:50%; background:var(--paper);
  right:calc(var(--stubw,70px) - 11px);
}
.ticket::after{bottom:-11px}
.party-label{margin:0 0 8px; font-size:14px; color:var(--gold); font-weight:700; letter-spacing:.02em}
.clock{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:0 0 16px; max-width:360px}
.clock div{background:color-mix(in srgb,var(--ticket-ink) 10%,transparent); border-radius:10px; padding:8px 4px 6px; text-align:center}
.clock b{display:block; font-family:"Young Serif",Georgia,serif; font-weight:400; font-size:28px; line-height:1.1; font-variant-numeric:tabular-nums; color:var(--gold)}
.clock span{font-size:11px; opacity:.75; text-transform:uppercase; letter-spacing:.06em}
.clock[hidden]{display:none}
.party-note{margin:12px 0 0; font-size:13px; opacity:.75}

/* Tabs */
.tabs{display:flex; gap:22px; border-bottom:1px solid var(--line); margin-bottom:22px}
.tabs button{
  border:0; background:none; font:inherit; font-size:17px; color:var(--muted); padding:8px 0 10px; cursor:pointer;
  border-bottom:3px solid transparent; margin-bottom:-1px;
}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--rose); font-weight:700}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sky); outline-offset:2px}
.panel[hidden]{display:none}

/* Generator */
.intro{color:var(--muted); margin:0 0 18px; max-width:60ch}
.tagbox{background:var(--rose-soft); border-radius:12px; padding:14px 16px; margin-bottom:18px}
.tagbox p{margin:0}
.hashes.soon{color:var(--muted); font-weight:400; font-size:14px}
.tb-label{font-size:11px; font-weight:700; letter-spacing:.12em; color:var(--muted); margin-bottom:2px !important}
.tb-gap{margin-top:10px !important}
.tagline{font-family:"Noto Sans KR",-apple-system,system-ui,sans-serif; font-weight:700; font-size:17px}
.hashes{color:var(--rose); font-weight:700; word-break:break-word}
.controls{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin-bottom:16px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--surface)}
.seg button{border:0; background:none; font:inherit; font-size:14px; padding:8px 14px; color:var(--muted); cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.check{display:inline-flex; gap:6px; align-items:center; font-size:14px; color:var(--muted); cursor:pointer}
.check input{accent-color:var(--rose); width:16px; height:16px}
.primary{
  border:0; background:var(--rose); color:#fff; font:inherit; font-weight:700; font-size:16px;
  padding:12px 22px; border-radius:12px; cursor:pointer; width:100%; margin-bottom:20px;
}
.primary:active{transform:translateY(1px)}
.list{display:grid; gap:12px; margin:0; padding:0; list-style:none}
.post{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px}
.post pre{margin:0 0 12px; white-space:pre-wrap; word-break:break-word; font:inherit; font-size:15px}
.post-foot{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
.count{font-size:13px; color:var(--muted)}
.count.over{color:#D6453D; font-weight:700}
.actions{display:flex; gap:8px}
.btn{
  border:1px solid var(--line); background:var(--paper); color:var(--ink); font:inherit; font-size:14px;
  padding:7px 14px; border-radius:9px; cursor:pointer; text-decoration:none; display:inline-block;
}
.btn.done{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.xfallback{margin:10px 0 0; font-size:13px; color:var(--muted)}
.xfallback a{color:var(--rose); font-weight:700}
.empty{color:var(--muted); text-align:center; padding:28px 12px; border:1px dashed var(--line); border-radius:14px}

/* Guidelines */
.gsec{margin:0 0 26px}
.gsec h2{font-family:"Young Serif",Georgia,serif; font-weight:400; font-size:22px; margin:0 0 10px}
body[data-lang="ko"] .gsec h2, body[data-lang^="zh"] .gsec h2{font-family:inherit; font-weight:700}
body[data-lang="ko"] .ticket-film, body[data-lang^="zh"] .ticket-film, body[data-lang="ko"] .ticket-star, body[data-lang^="zh"] .ticket-star{font-family:inherit; font-weight:700; letter-spacing:.01em}
.gsec ol{margin:0; padding-left:1.6em}
.gsec li{margin:0 0 8px; padding-left:4px}
.gsec li::marker{color:var(--rose); font-weight:700}

@media (max-width:520px){
  .ticket{grid-template-columns:1fr}

const $ = s=>document.querySelector(s);
const pick = a=>a[Math.floor(Math.random()*a.length)];
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let lang = "en", outLang = "ko";

function xLen(s){
  let n=0;
  for(const ch of s){
    const c=ch.codePointAt(0);
    const light=(c<=0x10FF)||(c>=0x2000&&c<=0x200D)||(c>=0x2010&&c<=0x201F)||(c>=0x2032&&c<=0x2037);
    n+= light?1:2;
  }
  return n;
}

const decks={en:[],ko:[]};
function draw(L){
  if(!decks[L].length) decks[L]=shuffle(POSTS[L]);
  return decks[L].pop();
}

const REVEAL=new Date("2026-10-06T18:00:00+08:00").getTime();
const dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0)));
const SECRET={tag:"",hash:""};
const revealed=()=>false;
let wasRevealed=null;
function renderTagbox(){
  const r=revealed(), t=I18N[lang];
  $("#tbHash").classList.toggle("soon",!r);
  if(r){ $("#tbTag").textContent=SECRET.tag; $("#tbHash").textContent=SECRET.hash; }
  else{
    $("#tbTag").textContent="COMING SOON";
    let when="";
    try{
      const loc={"zh-Hant":"zh-TW","zh-Hans":"zh-CN",ko:"ko-KR",en:"en-US"}[lang];
      when=new Intl.DateTimeFormat(loc,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit",timeZoneName:"short"}).format(new Date(REVEAL));
    }catch(e){ when=new Date(REVEAL).toLocaleString(); }
    $("#tbHash").textContent=t.revealAt(when);
  }
  if(wasRevealed===false && r){ const l=$("#list"); if(l.querySelector(".post")) generate(); }
  wasRevealed=r;
}

function compose(){
  const L = outLang==="mix" ? (Math.random()<0.7?"ko":"en") : outLang;
  const lines=[draw(L)];
  if(revealed()){ lines.push(SECRET.tag); lines.push(SECRET.hash); }
  return lines.join("\n\n");
}

function generate(){
  const list=$("#list"); list.innerHTML="";
  const t=I18N[lang];
  for(let i=0;i<1;i++){
    const txt=compose();
    const len=xLen(txt);
    const li=document.createElement("li"); li.className="post";
    const pre=document.createElement("pre"); pre.textContent=txt;
    const foot=document.createElement("div"); foot.className="post-foot";
    const cnt=document.createElement("span"); cnt.className="count"+(len>280?" over":"");
    cnt.textContent = len>280 ? t.over : `${len} ${t.chars}`;
    const acts=document.createElement("div"); acts.className="actions";
    const cp=document.createElement("button"); cp.className="btn"; cp.textContent=t.copy;
    cp.onclick=()=>copyText(txt,cp);
    const a=document.createElement("a"); a.className="btn"; a.textContent=t.post; a.target="_blank"; a.rel="noopener";
    a.href="https://x.com/intent/post?text="+encodeURIComponent(txt);
    a.onclick=e=>openX(e,txt,li);
    acts.append(cp,a); foot.append(cnt,acts); li.append(pre,foot); list.append(li);
  }
}

function openX(e,txt,li){
  const ua=navigator.userAgent||"";
  const isAndroid=/Android/i.test(ua);
  const isIOS=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  if(!isAndroid&&!isIOS) return; // desktop: normal web link
  e.preventDefault();
  const web="https://x.com/intent/post?text="+encodeURIComponent(txt);
  const app = isAndroid
    ? "intent://post?message="+encodeURIComponent(txt)+"#Intent;scheme=twitter;package=com.twitter.android;S.browser_fallback_url="+encodeURIComponent(web)+";end"
    : "twitter://post?message="+encodeURIComponent(txt);
  let left=false;
  const mark=()=>{left=true};
  document.addEventListener("visibilitychange",mark,{once:true});
  window.addEventListener("pagehide",mark,{once:true});
  window.addEventListener("blur",mark,{once:true});
  try{ window.top.location.href=app; }catch(err){ try{ window.location.href=app; }catch(e2){} }
  setTimeout(()=>{
    if(left||document.hidden) return;
    let fb=li.querySelector(".xfallback");
    if(!fb){
      fb=document.createElement("p"); fb.className="xfallback";
      const l=document.createElement("a"); l.href=web; l.target="_blank"; l.rel="noopener"; l.textContent=I18N[lang].xWeb;
      fb.append(I18N[lang].xNo+" ",l); li.append(fb);
    }
  },1600);
}

function copyText(txt,btn){
  const ok=()=>{btn.textContent=I18N[lang].copied; btn.classList.add("done");
    setTimeout(()=>{btn.textContent=I18N[lang].copy; btn.classList.remove("done")},1600)};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok).catch(()=>fallback());
  } else fallback();
  function fallback(){
    const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.append(ta); ta.select(); try{document.execCommand("copy"); ok();}catch(e){} ta.remove();
  }
}

function renderGuide(){
  const g=$("#guide"); g.innerHTML="";
  I18N[lang].guide.forEach(([title,items])=>{
    const s=document.createElement("section"); s.className="gsec";
    const h=document.createElement("h2"); h.textContent=title;
    const ol=document.createElement("ol");
    items.forEach(x=>{const li=document.createElement("li"); li.textContent=x; ol.append(li)});
    s.append(h,ol); g.append(s);
  });
}

function setLang(l){
  lang=l; document.body.dataset.lang=l; document.documentElement.lang=l;
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===l));
  document.querySelectorAll("[data-i18n]").forEach(el=>{const v=I18N[l][el.dataset.i18n]; if(typeof v==="string") el.textContent=v;});
  $("#still").src=BANNERS[l];
  renderGuide(); renderLocal(); renderTagbox(); tick();
  document.querySelectorAll("#list .post").forEach(li=>{
    const b=li.querySelector("button.btn"); if(b) b.textContent=I18N[l].copy;
    const a=li.querySelector("a.btn"); if(a) a.textContent=I18N[l].post;
    const c=li.querySelector(".count"); if(c&&!c.classList.contains("over")) c.textContent=c.textContent.split(" ")[0]+" "+I18N[l].chars;
    else if(c) c.textContent=I18N[l].over;
  });

const PARTY=new Date("2026-10-06T18:00:00+09:00").getTime();
const pad=n=>String(n).padStart(2,"0");
function tick(){
  const t=I18N[lang], diff=PARTY-Date.now(), lb=$("#partyLabel"), clock=$("#clock");
  if(diff>0){
    lb.textContent=t.lbBefore; clock.hidden=false;
    $("#cd-d").textContent=pad(Math.floor(diff/864e5));
    $("#cd-h").textContent=pad(Math.floor(diff%864e5/36e5));
    $("#cd-m").textContent=pad(Math.floor(diff%36e5/6e4));
    $("#cd-s").textContent=pad(Math.floor(diff%6e4/1e3));
  } else {
    clock.hidden=true;
    lb.textContent = diff>-4*36e5 ? t.lbLive : t.lbAfter;
  }
}
function renderLocal(){
  try{
    const loc={"zh-Hant":"zh-TW","zh-Hans":"zh-CN",ko:"ko-KR",en:"en-US"}[lang];
    $("#localTime").textContent=new Intl.DateTimeFormat(loc,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit",timeZoneName:"short"}).format(new Date(PARTY));
  }catch(e){ $("#localTime").textContent=new Date(PARTY).toLocaleString(); }
}

function setStubWidth(){
  const t=document.querySelector(".ticket"), s=$("#stub"), im=document.querySelector(".ticket-still");
  if(s) t.style.setProperty("--stubw", s.offsetWidth+"px");
  if(im) t.style.setProperty("--imgh", im.offsetHeight+"px");
}
$("#still").addEventListener("load",setStubWidth);

document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
  outLang=b.dataset.out;
  document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed", x===b));
});
$("#genBtn").onclick=generate;
const tabs=[["#tab-gen","#panel-gen"],["#tab-guide","#panel-guide"]];
tabs.forEach(([t,p])=>{
  $(t).onclick=()=>{tabs.forEach(([t2,p2])=>{$(t2).setAttribute("aria-selected",t2===t); $(p2).hidden=(p2!==p);});};
});

let saved=null; try{saved=localStorage.getItem("biff-lang")}catch(e){}
if(!saved){
  const n=(navigator.language||"en").toLowerCase();
  saved = n.startsWith("ko")?"ko" : (n.includes("zh-cn")||n.includes("zh-sg")||n.includes("hans"))?"zh-Hans" : n.startsWith("zh")?"zh-Hant" : "en";
}
setLang(I18N[saved]?saved:"en");
setStubWidth(); window.addEventListener("resize",setStubWidth);
setInterval(()=>{tick(); renderTagbox();},1000);
</script>
